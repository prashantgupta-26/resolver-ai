<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Student Account</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
}

/* CARD */
.container{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

/* INPUT GROUP */
.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
    color:#555;
}

.input-group input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#4facfe;
    box-shadow:0 0 5px rgba(79,172,254,0.5);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#007bff;
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form onsubmit="createAccount(event)">

        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="input-group">
            <label>Institute Roll No</label>
            <input type="text" id="roll" required>
        </div>

        <div class="input-group">
            <label>Course</label>
            <input type="text" id="course" placeholder="e.g. Science, Commerce" required>
        </div>

        <button type="submit">Create Account</button>

    </form>

</div>

<script>

function createAccount(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const roll = document.getElementById("roll").value.trim();
    const course = document.getElementById("course").value.trim();

    if(!name || !roll || !course){
        alert("Please fill all fields!");
        return;
    }

    // Save data
    localStorage.setItem("studentName", name);
    localStorage.setItem("studentRoll", roll);
    localStorage.setItem("studentCourse", course);

    alert("Account Created Successfully 🎉");

    // Redirect
    window.location.href = "homepage_student.html";
}

</script>

</body>
</html>
