<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolve Ai</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    height: 100vh;
    width: 100%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

h2{
    margin-bottom: 20px;
    color: #333;
}

.signup, .login{
    margin: 20px 0;
    padding: 15px;
    border-radius: 10px;
    background-color: #f5f5f5;
}

.signup h3, .login h3, .login h4{
    margin-bottom: 10px;
    color: #444;
}

button{
    width: 80%;
    padding: 10px;
    margin: 6px 0;
    border: none;
    border-radius: 6px;
    background: #4facfe;
    transition: 0.3s;
    cursor: pointer;
}

button:hover{
    background: #007bff;
    transform: scale(1.05);
}

button a{
    text-decoration: none;
    color: white;
    font-weight: bold;
    display: block;
}

.login{
    background-color: #eef7ff;
}
</style>
<body>
    <div class="container">
        <h2>Resolve Ai-HelpDesk For Students</h2>
    <div class="signup">
        <h3>Sign Up</h3>
        <button> <a href="student.signup.html" > As Student</a></button><br>
        <button><a href="coun.signup.html">As Counsellor</a></button><br>
    </div>
</body>
</html>
