<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counsellor Signup</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
}

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
}

.input-group input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#007bff;
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="container">

    <h2>Counsellor Signup</h2>

    <form id="form">

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="input-group">
            <label>Faculty Number</label>
            <input type="text" id="faculty" required>
        </div>

        <button type="submit">Verify</button>

    </form>

</div>

<script>

const validFaculty = ["123456", "654321", "111222", "999888"];

document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();

    const faculty = document.getElementById("faculty").value.trim();
    const name = document.getElementById("name").value.trim();

    console.log("Clicked Verify"); // 🔍 debug

    if(validFaculty.includes(faculty)){
        alert("Verified ✅");

        localStorage.setItem("counsellorName", name);
        localStorage.setItem("facultyNo", faculty);

        // 🔥 REDIRECT
        window.location.href = "./homepage_counsellor.html";

    } else {
        alert("Wrong Faculty Number ❌");
    }
});

</script>

</body>
</html>
